name: Build DIAS Jupiter PJ7 Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-map:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install map tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin
          python -m pip install --upgrade pip
          pip install numpy pillow rasterio requests

      - name: Find and download official PJ7 JunoCam Global Map
        shell: bash
        run: |
          cat > /tmp/download_pj7_gmi.py <<'PY'
          from pathlib import Path
          import re
          import requests
          from urllib.parse import urljoin

          ROOT = "https://planetarydata.jpl.nasa.gov/img/data/juno/"
          OUT = Path("juno_pj7_source")
          OUT.mkdir(exist_ok=True)

          def get(url):
              r = requests.get(url, timeout=60)
              r.raise_for_status()
              return r

          root_html = get(ROOT).text
          volumes = sorted(
              set(re.findall(r'href="(JNOJNC_\d{4}/)"', root_html, flags=re.I)),
              reverse=True,
          )

          if not volumes:
              raise RuntimeError("No JunoCam PDS volumes discovered.")

          selected = None

          # First choice: exact PJ7 date/orbit color map.
          # PJ7 occurred on 2017-07-11 = DOY 192.
          patterns = (
              re.compile(r"^JNCR_2017192_07P.*\.LBL$", re.I),
              re.compile(r"^JNCR_.*_07P.*\.LBL$", re.I),
          )

          for pat in patterns:
              for vol in volumes:
                  durl = urljoin(ROOT, vol + "DATA/GLOBAL_MAPS/")
                  try:
                      html = get(durl).text
                  except Exception:
                      continue

                  hrefs = re.findall(r'href="([^"]+)"', html, flags=re.I)
                  labels = sorted(
                      [h for h in hrefs if pat.match(Path(h).name)],
                      reverse=True,
                  )
                  if labels:
                      lbl_name = Path(labels[0]).name
                      img_name = lbl_name[:-4] + ".IMG"
                      selected = (vol, durl, lbl_name, img_name)
                      break
              if selected:
                  break

          if not selected:
              raise RuntimeError(
                  "Official PJ7 JunoCam color Global Map was not found in PDS. "
                  "Workflow stops rather than silently using another epoch."
              )

          vol, durl, lbl_name, img_name = selected
          lbl_url = urljoin(durl, lbl_name)
          img_url = urljoin(durl, img_name)

          print("SELECTED VOLUME:", vol)
          print("LABEL:", lbl_url)
          print("IMAGE:", img_url)

          lbl = get(lbl_url).content
          img = get(img_url).content

          (OUT / "source.LBL").write_bytes(lbl)
          (OUT / "source.IMG").write_bytes(img)

          # Preserve original filenames as metadata.
          (OUT / "source_urls.txt").write_text(
              f"volume={vol}\nlabel={lbl_url}\nimage={img_url}\n",
              encoding="utf-8",
          )

          print("LBL bytes:", len(lbl))
          print("IMG bytes:", len(img))
          PY

          python /tmp/download_pj7_gmi.py

          echo "---- PDS LABEL ----"
          sed -n '1,220p' juno_pj7_source/source.LBL
          echo "---- SOURCE URLS ----"
          cat juno_pj7_source/source_urls.txt

      - name: Convert PDS3 map to GeoTIFF
        shell: bash
        run: |
          gdalinfo juno_pj7_source/source.LBL
          gdal_translate \
            -of GTiff \
            juno_pj7_source/source.LBL \
            juno_pj7_source/pj7_global_map.tif
          gdalinfo juno_pj7_source/pj7_global_map.tif

      - name: Build DIAS 16K WebP tile pyramid
        shell: bash
        run: |
          cat > /tmp/build_dias_jupiter_map.py <<'PY'
          from pathlib import Path
          import json
          import math
          import re
          import shutil

          import numpy as np
          import rasterio
          from PIL import Image

          SRC_TIF = Path("juno_pj7_source/pj7_global_map.tif")
          SRC_LBL = Path("juno_pj7_source/source.LBL")
          SRC_URLS = Path("juno_pj7_source/source_urls.txt")

          ROOT = Path("dias_jupiter_map")
          TILES = ROOT / "tiles"

          TILE = 256
          MAX_Z = 5
          QUALITY = 86

          # Canonical DIAS v1 geometry.
          JUPITER_A_KM = 71488.0
          JUPITER_C_KM = 66842.0
          EQUATOR_TO_POLE_GD = 799.0
          POLE_TO_POLE_GD = 1598.0

          # Canonical Omphalos / Pantoptis Eye v1.
          OM_PHALOS_SYSTEM_III_W_DEG = 60.0
          OM_PHALOS_PG_LAT_DEG = -22.610918118371206
          OM_PHALOS_PC_LAT_DEG = -20.006972747
          OM_PHALOS_SOUTH_OFFSET_KM = 8.636510

          # EA structure.
          EQUATOR_V = 400.5
          H_PERIOD = 1260.0
          H_ZERO_SYSTEM_III_W_DEG = 60.0

          # Legacy source axes are visual/cartographic source metadata only.
          # DIAS metric calculations use the Juno-2026 physical axes above.
          EXPECTED_SOURCE_A_KM = 71492.0
          EXPECTED_SOURCE_C_KM = 66854.0

          if ROOT.exists():
              shutil.rmtree(ROOT)
          TILES.mkdir(parents=True, exist_ok=True)

          label = SRC_LBL.read_text(encoding="latin-1", errors="replace")

          def pds_text(key, default=None):
              m = re.search(
                  rf"^\s*{re.escape(key)}\s*=\s*([^\r\n]+)",
                  label,
                  flags=re.I | re.M,
              )
              if not m:
                  if default is not None:
                      return default
                  raise RuntimeError(f"Missing PDS key: {key}")
              return m.group(1).strip().strip('"')

          def pds_float(key, default=None):
              raw = pds_text(key, default)
              if isinstance(raw, (int, float)):
                  return float(raw)
              raw = re.sub(r"<[^>]+>", "", raw).strip()
              return float(raw)

          projection = pds_text("MAP_PROJECTION_TYPE")
          coord_name = pds_text("COORDINATE_SYSTEM_NAME")
          lon_direction = pds_text("POSITIVE_LONGITUDE_DIRECTION")
          center_lon = pds_float("CENTER_LONGITUDE")
          map_resolution = pds_float("MAP_RESOLUTION")
          source_a = pds_float("A_AXIS_RADIUS")
          source_c = pds_float("C_AXIS_RADIUS")

          if projection.upper() != "SIMPLE CYLINDRICAL":
              raise RuntimeError(f"Unexpected projection: {projection}")
          if coord_name.upper() != "PLANETOGRAPHIC":
              raise RuntimeError(f"Unexpected latitude system: {coord_name}")
          if lon_direction.upper() != "WEST":
              raise RuntimeError(f"Unexpected longitude direction: {lon_direction}")

          if abs(source_a - EXPECTED_SOURCE_A_KM) > 0.1:
              raise RuntimeError(f"Unexpected source A radius: {source_a}")
          if abs(source_c - EXPECTED_SOURCE_C_KM) > 0.1:
              raise RuntimeError(f"Unexpected source C radius: {source_c}")

          with rasterio.open(SRC_TIF) as src:
              arr = src.read()
              print("SOURCE SHAPE:", arr.shape)
              print("SOURCE DTYPE:", arr.dtype)

          if arr.ndim != 3 or arr.shape[0] < 3:
              raise RuntimeError(f"Expected RGB source, got shape {arr.shape}")

          arr = arr[:3]

          # Convert source to display uint8 if needed, preserving each channel.
          if arr.dtype != np.uint8:
              out = np.zeros(arr.shape, dtype=np.uint8)
              for b in range(3):
                  band = arr[b].astype(np.float64)
                  finite = np.isfinite(band)
                  vals = band[finite]
                  if vals.size < 1000:
                      raise RuntimeError("Too few valid source pixels.")
                  lo, hi = np.percentile(vals, [0.5, 99.5])
                  if hi <= lo:
                      raise RuntimeError("Invalid display stretch.")
                  scaled = (band - lo) * (255.0 / (hi - lo))
                  scaled = np.clip(scaled, 0.0, 255.0)
                  out[b] = scaled.astype(np.uint8)
              arr = out

          # Rasterio -> Pillow RGB.
          rgb = np.moveaxis(arr, 0, 2)
          img = Image.fromarray(rgb, mode="RGB")

          # PDS GMI standard product:
          # simple cylindrical, planetographic, west-positive,
          # center longitude = 0 deg.
          #
          # Recenter visual map so canonical H=0 / Pantoptis meridian
          # (60 deg W System III) lies exactly at the horizontal centre.
          width, height = img.size
          px_per_deg = width / 360.0

          if abs(px_per_deg - map_resolution) > 0.05:
              raise RuntimeError(
                  f"Raster width implies {px_per_deg} px/deg, "
                  f"label says {map_resolution}."
              )

          source_x_of_omphalos = (
              width / 2.0
              + (OM_PHALOS_SYSTEM_III_W_DEG - center_lon) * px_per_deg
          ) % width
          shift_px = int(round(width / 2.0 - source_x_of_omphalos))

          rgb_np = np.asarray(img)
          rgb_np = np.roll(rgb_np, shift_px, axis=1)
          img.close()
          img = Image.fromarray(rgb_np, mode="RGB")

          # Canonical web raster 2:1.
          WEB_W = 16384
          WEB_H = 8192
          img = img.resize((WEB_W, WEB_H), Image.Resampling.LANCZOS)

          # z5: 64 x 32.
          nx = WEB_W // TILE
          ny = WEB_H // TILE
          if nx != 64 or ny != 32:
              raise RuntimeError("Unexpected z5 tile matrix.")

          z5 = TILES / str(MAX_Z)
          for x in range(nx):
              xdir = z5 / str(x)
              xdir.mkdir(parents=True, exist_ok=True)
              for y in range(ny):
                  tile = img.crop(
                      (x*TILE, y*TILE, (x+1)*TILE, (y+1)*TILE)
                  )
                  tile.save(
                      xdir / f"{y}.webp",
                      "WEBP",
                      quality=QUALITY,
                      method=6,
                      optimize=True,
                  )
                  tile.close()

          img.close()

          # Lower zooms strictly from child tiles.
          for z in range(MAX_Z - 1, -1, -1):
              nx = 2 ** (z + 1)
              ny = 2 ** z

              for x in range(nx):
                  xdir = TILES / str(z) / str(x)
                  xdir.mkdir(parents=True, exist_ok=True)

                  for y in range(ny):
                      canvas = Image.new("RGB", (512, 512), (0, 0, 0))

                      for dx in (0, 1):
                          for dy in (0, 1):
                              child = Image.open(
                                  TILES / str(z + 1) /
                                  str(2*x + dx) /
                                  f"{2*y + dy}.webp"
                              ).convert("RGB")
                              canvas.paste(child, (dx*TILE, dy*TILE))
                              child.close()

                      parent = canvas.resize(
                          (TILE, TILE),
                          Image.Resampling.LANCZOS,
                      )
                      parent.save(
                          xdir / f"{y}.webp",
                          "WEBP",
                          quality=QUALITY,
                          method=6,
                          optimize=True,
                      )
                      parent.close()
                      canvas.close()

          # Full-map preview from z0.
          left = Image.open(TILES / "0" / "0" / "0.webp").convert("RGB")
          right = Image.open(TILES / "0" / "1" / "0.webp").convert("RGB")
          preview = Image.new("RGB", (512, 256), (0, 0, 0))
          preview.paste(left, (0, 0))
          preview.paste(right, (256, 0))
          preview.save(
              ROOT / "preview_full_jupiter.webp",
              "WEBP",
              quality=92,
              method=6,
          )
          left.close()
          right.close()
          preview.close()

          total = sum(1 for _ in TILES.rglob("*.webp"))
          if total != 2730:
              raise RuntimeError(f"Expected 2730 tiles, produced {total}")

          urls = {}
          for line in SRC_URLS.read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  urls[k] = v

          # Juno-2026 physical meridian geometry for GΔ.
          e2 = 1.0 - (JUPITER_C_KM / JUPITER_A_KM) ** 2

          # scipy is deliberately not required in this map-only workflow.
          # The locked value comes from DIAS_JUPITER_CORE_V1.
          METERS_PER_GD = 136013.477992058

          manifest = {
              "project": "DIAS",
              "map_id": "DIAS_JUPITER_PJ7_GMI_V1",
              "dataset": "NASA/JPL PDS JunoCam PJ7 Global Map Image",
              "source_product_label_url": urls.get("label"),
              "source_product_image_url": urls.get("image"),
              "source_volume": urls.get("volume"),
              "source_projection": projection,
              "source_latitude_type": coord_name.lower(),
              "source_longitude_direction": lon_direction.lower(),
              "source_center_longitude_deg": center_lon,
              "source_pixels_per_degree": map_resolution,
              "source_reference_axes_km": {
                  "a": source_a,
                  "c": source_c,
                  "note":
                      "PDS JunoCam cartographic source axes; visual basemap only."
              },
              "dias_metric_reference": {
                  "surface": "Juno-2026 physical 1-bar central estimate",
                  "a_km": JUPITER_A_KM,
                  "c_km": JUPITER_C_KM,
                  "e2": e2,
                  "equator_to_pole_GD": EQUATOR_TO_POLE_GD,
                  "pole_to_pole_GD": POLE_TO_POLE_GD,
                  "meters_per_GD": METERS_PER_GD,
              },
              "ea": {
                  "equator_V": EQUATOR_V,
                  "horizontal_period": H_PERIOD,
                  "H0_system_III_w_deg": H_ZERO_SYSTEM_III_W_DEG,
              },
              "canonical_omphalos": {
                  "name": "Pantoptis Ophthalmos / Great Red Spot",
                  "epoch": "PJ7, 2017-07-11",
                  "system_III_w_deg": OM_PHALOS_SYSTEM_III_W_DEG,
                  "planetographic_lat_deg": OM_PHALOS_PG_LAT_DEG,
                  "planetocentric_lat_deg": OM_PHALOS_PC_LAT_DEG,
                  "south_offset_from_nominal_PJ7_center_km":
                      OM_PHALOS_SOUTH_OFFSET_KM,
              },
              "web_map": {
                  "projection": "Simple Cylindrical / equirectangular",
                  "latitude_type": "planetographic",
                  "longitude_direction": "positive west",
                  "centre_system_III_w_deg": OM_PHALOS_SYSTEM_III_W_DEG,
                  "centre_is_H0": True,
                  "relative_longitude_domain_deg": [-180, 180],
                  "latitude_domain_deg": [-90, 90],
                  "web_pixels": [WEB_W, WEB_H],
                  "tile_size": TILE,
                  "zoom_min": 0,
                  "zoom_max": MAX_Z,
                  "zoom_0_matrix": [2, 1],
                  "zoom_5_matrix": [64, 32],
                  "total_tiles": total,
                  "webp_quality": QUALITY,
                  "source_roll_pixels": shift_px,
              },
              "metric_note":
                  "The raster is a visual/cartographic basemap. "
                  "All DIAS distances in GΔ must be computed on the locked "
                  "Juno-2026 1-bar spheroid, not in flat-map pixels.",
              "credit":
                  "NASA/JPL-Caltech/SwRI/MSSS; Planetary Data System; "
                  "DIAS map tiling workflow.",
          }

          (ROOT / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          anchors = {
              "canonical_omphalos": manifest["canonical_omphalos"],
              "north_pole": {
                  "planetographic_lat_deg": 90.0,
                  "system_III_w_deg": OM_PHALOS_SYSTEM_III_W_DEG,
              },
              "south_pole": {
                  "planetographic_lat_deg": -90.0,
                  "system_III_w_deg": OM_PHALOS_SYSTEM_III_W_DEG,
              },
              "equator_H0": {
                  "planetographic_lat_deg": 0.0,
                  "system_III_w_deg": OM_PHALOS_SYSTEM_III_W_DEG,
                  "V": 400.5,
                  "H": 0.0,
              },
          }

          (ROOT / "anchors.json").write_text(
              json.dumps(anchors, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print("TOTAL TILES:", total)
          print("SOURCE ROLL PX:", shift_px)
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          python /tmp/build_dias_jupiter_map.py

      - name: Verify DIAS Jupiter map
        shell: bash
        run: |
          echo "Tile count:"
          find dias_jupiter_map/tiles -type f -name '*.webp' | wc -l

          echo "Map size:"
          du -sh dias_jupiter_map

          echo "Preview:"
          ls -lh dias_jupiter_map/preview_full_jupiter.webp

          echo "Manifest:"
          cat dias_jupiter_map/manifest.json

          echo "Anchors:"
          cat dias_jupiter_map/anchors.json

          test "$(find dias_jupiter_map/tiles -type f -name '*.webp' | wc -l)" -eq 2730

      - name: Commit DIAS Jupiter map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A dias_jupiter_map

          git commit -m "Build DIAS Jupiter PJ7 map" || {
            echo "No changes to commit."
            exit 0
          }

          git push origin HEAD:${{ github.ref_name }}
